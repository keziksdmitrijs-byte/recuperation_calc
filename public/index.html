<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekuperācijas kalkulators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563eb;--red:#dc2626;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--acc:#0f766e;--accl:#ccfbf1;--warn:#b45309;--warnbg:#fffbeb;--ok:#15803d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand{text-decoration:none;flex:none}
.brand img{height:26px;width:auto;display:block}
.appTitle{font-weight:600;font-size:14px;color:var(--mut);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.steps{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;flex-wrap:wrap}
.steps button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:500;color:var(--mut);white-space:nowrap}
.steps button .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#cbd5e1;color:#fff;font-size:11px;margin-right:6px}
.steps button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.steps button.on .n{background:var(--acc)}
.steps button.done .n{background:var(--ok)}
.hspace{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:#fff;padding:5px 9px;font-weight:600;font-size:12px;color:var(--mut)}
.lang button.on{background:var(--ink);color:#fff}
.lnk{color:var(--mut);text-decoration:none;font-size:13px}
.lnk:hover{color:var(--ink)}
main{flex:1;display:flex;min-height:0}
#side{width:350px;flex:none;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:16px 16px 24px}
#stage{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#floorTabs{display:flex;gap:4px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
#floorTabs button{border:1px solid var(--line);background:#fff;padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
#floorTabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:#e2e8f0;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:18px 18px}
svg#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
svg#plan.t-select{cursor:default}
svg#plan.t-draw{cursor:crosshair}
svg#plan.panning{cursor:grabbing}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);padding:24px}
#empty .box{background:#fff;border:2px dashed #cbd5e1;border-radius:14px;padding:32px 40px;max-width:420px}
#empty .box b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
#canvasWrap.drop #empty .box,#canvasWrap.drop{outline:3px solid var(--acc);outline-offset:-3px}
#zoomBar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#zoomBar button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#zoomBar button:disabled{opacity:.4;cursor:default}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;padding:7px 14px;border-radius:9px;font-size:13px;max-width:min(680px,80%);text-align:center;pointer-events:none}
#hint:empty{display:none}
#props{position:absolute;left:12px;bottom:12px;width:300px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.16);padding:12px 14px;font-size:13px}
#props:empty{display:none}
#props h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
#props .row{display:flex;justify-content:space-between;gap:8px;margin:5px 0;align-items:center}
#props .row span:first-child{color:var(--mut)}
#props select,#props input{max-width:170px}
#estimateView{flex:1;overflow:auto;padding:24px 28px;display:none}
body.est #estimateView{display:block}
body.est #stage{display:none}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:20px 0 8px}
p.hint{color:var(--mut);margin:4px 0 12px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px}
.btn:hover{border-color:#94a3b8}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#115e59}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;justify-content:flex-start;text-align:left}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.sw.c{border-radius:50%}
label.fld{display:block;margin:10px 0}
label.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
input:focus,select:focus{outline:2px solid var(--accl);border-color:var(--acc)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;background:#fff}
.floorRow{display:flex;align-items:center;gap:8px}
.floorRow.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accl)}
.floorRow .nm{flex:1;font-weight:600;cursor:pointer}
.floorRow .st{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--mut);font-weight:600}
.tag.ok{background:#dcfce7;color:var(--ok)}
.tag.bad{background:#fee2e2;color:var(--red)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.recup{display:flex;gap:10px;align-items:center;cursor:pointer;transition:.1s}
.recup:hover{border-color:#94a3b8}
.recup.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--accl)}
.recup.dim{background:#334155;color:#cbd5e1;border-color:#334155}
.recup.dim .mut{color:#94a3b8}
.recup .nm{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.recup .pr{margin-left:auto;font-weight:600;white-space:nowrap}
.mut{color:var(--mut)}
.sum{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:18px;font-size:13px}
.sum .row{display:flex;justify-content:space-between;gap:10px;margin:3px 0}
.sum .row b{font-weight:600}
.chk{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;border:1px solid var(--line)}
.chk.ok{border-color:#bbf7d0;background:#f0fdf4}
.chk.bad{border-color:#fecaca;background:#fef2f2}
.chk .t{font-weight:600;display:flex;align-items:center;gap:6px}
.warns{background:var(--warnbg);border:1px solid #fde68a;border-radius:10px;padding:8px 12px;margin:12px 0;font-size:13px;color:#78350f}
.warns ul{margin:4px 0 0;padding-left:18px}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
table.est{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px}
table.est th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);background:#f8fafc}
table.est td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
table.est td.n,table.est th.n{text-align:right;white-space:nowrap}
table.est tr.grp td{background:#f8fafc;font-weight:600;color:var(--ink)}
table.est tr.tot td{font-weight:600;border-bottom:0}
table.est tr.grand td{font-weight:700;font-size:15px;border-top:2px solid var(--ink)}
.estWrap{max-width:980px;margin:0 auto}
.estHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 16px}
.kpi{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:17px;font-weight:700}
.demo{background:#fef3c7;color:#92400e;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
.modalBg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:14px;padding:18px 20px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 10px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;place-items:center;z-index:95;font-weight:600}
#busy.show{display:grid}
/* admin */
#adminView{display:none;flex:1;overflow:auto;padding:24px}
body.admin #adminView{display:block}
body.admin main{display:none}
body.admin .steps{visibility:hidden}
.admWrap{max-width:1200px;margin:0 auto}
.admWrap .card{padding:16px}
.setGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px}
table.cat{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.cat th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cat td{padding:3px 4px;border-bottom:1px solid #f1f5f9}
table.cat input,table.cat select{padding:4px 6px;font-size:13px}
table.cat input.off{background:#f8fafc;color:#cbd5e1;border-color:#f1f5f9}
table.cat td.w-type{width:150px}
table.cat td.w-num{width:90px}
table.cat td.w-kind{width:110px}
.admBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
@media (max-width:860px){
  main{flex-direction:column-reverse}
  #side{width:100%;height:44vh;border-right:0;border-top:1px solid var(--line)}
  #props{width:auto;right:12px}
  .steps button{padding:5px 7px}
  .steps button .lbl{display:none}
  .appTitle{display:none}
}
</style>
</head>

function modal({title,html='',okText,cancelText,buttons}){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modalBg';
    const btns=buttons||[{v:null,label:cancelText||t('cancel')},{v:true,label:okText||t('ok'),pri:true}];
    bg.innerHTML=`<form class="modal"><h3>${esc(title)}</h3><div>${html}</div><div class="acts">${btns.map((b,i)=>`<button type="${b.pri?'submit':'button'}" class="btn ${b.pri?'pri':''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></form>`;
    document.body.appendChild(bg);
    const form=bg.querySelector('form');
    const vals=()=>{const o={};form.querySelectorAll('[name]').forEach(i=>o[i.name]=i.value);return o};
    const done=v=>{bg.remove();res(v)};
    form.addEventListener('submit',e=>{e.preventDefault();const b=btns.find(b=>b.pri);done(b.v===true?vals():b.v)});
    form.querySelectorAll('button[type=button]').forEach(b=>b.addEventListener('click',()=>{const x=btns[+b.dataset.i];done(x.v===true?vals():x.v)}));
    bg.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();done(null)}});
    setTimeout(()=>{const i=form.querySelector('input,select');(i||form.querySelector('.pri')).focus();if(i&&i.select)i.select()},30);
  });
}
async function saveBlob(blob,filename){
  try{ if(window.claude&&typeof claude.use==='function'){ const d=await claude.use('downloads'); if(d){ await d.save({filename,data:blob}); return true } } }
  catch(e){ if(e&&e.code==='declined') return false; console.warn(e) }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return true;
}

let sess=null;
async function sbAuth(grant,body){
  const r=await fetch(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||j.message||('HTTP '+r.status)),{status:r.status});
  sess={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||body.email||(sess&&sess.email)||''};
  try{sessionStorage.setItem('recu_sb',JSON.stringify(sess))}catch(e){}return sess}
async function sbToken(){
  if(!sess){try{sess=JSON.parse(sessionStorage.getItem('recu_sb')||'null')}catch(e){}}
  if(!sess||!sess.access_token)return null;
  if(Date.now()>sess.expires_at-60000){try{await sbAuth('refresh_token',{refresh_token:sess.refresh_token})}catch(e){sbLogout();return null}}
  return sess.access_token}
function sbLogout(){sess=null;try{sessionStorage.removeItem('recu_sb')}catch(e){}}
async function sb(path,{method='GET',body,auth=false,prefer}={}){
  const h={apikey:SB.key,'Content-Type':'application/json'};let tok=SB.key;
  if(auth){tok=await sbToken();if(!tok)throw Object.assign(new Error('auth'),{status:401})}
  h.Authorization='Bearer '+tok;if(prefer)h.Prefer=prefer;
  const r=await fetch(SB.url+path,{method,headers:h,cache:'no-store',body:body!==undefined?JSON.stringify(body):undefined});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.message||j.error_description||j.msg||m}catch(e){}throw Object.assign(new Error(m),{status:r.status})}
  const txt=await r.text();return txt?JSON.parse(txt):null}
function normData(d){
  const out={settings:{...DEFAULT_SETTINGS,...(d&&d.settings||{})},items:[],demo:!!(d&&d.demo)};
  for(const k in out.settings) out.settings[k]=num(out.settings[k]);
  (d&&d.items||[]).forEach(it=>{ if(!TYPES.includes(it.type)) return;
    out.items.push({id:it.id||uid(),type:it.type,sku:String(it.sku??''),name:String(it.name??''),group:String(it.group??''),dims:String(it.dims??''),diameter:num(it.diameter),inlet:num(it.inlet),airflow:num(it.airflow),outlets:Math.round(num(it.outlets)),length:num(it.length),kind:['supply','extract','any'].includes(it.kind)?it.kind:'any',price:num(it.price)}) });
  return out;
}

// ---------------------------------------------------------------- persistence (IndexedDB)
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('recu',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const q=tx.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

// ---------------------------------------------------------------- plan import
async function importPlanFile(file){
  const f=curFloor(); if(!file) return;
  if(f.imageId && !(await modal({title:t('replace_plan'),html:`<p class="hint">${esc(t('replace_q'))}</p>`,okText:t('yes')}))) return;
  busy(true,t('loading'));
  try{
    let src;
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)) src=await pdfToImage(file);
    else src=await fileToDataURL(file);
    if(!src){busy(false);return}
    const img=await loadImg(src);
    let w=img.naturalWidth,h=img.naturalHeight;const MAX=3600;
    if(Math.max(w,h)>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);src=c.toDataURL('image/jpeg',.9)}
    snap();
    const id=uid(); images[id]={src,w,h};
    if(f.imageId){f.scale=null}
    f.imageId=id; selected=null; draft=null;
    changed(); fitView();
  }catch(e){console.error(e);toast(String(e.message||e),true)}
  busy(false);
}
const fileToDataURL=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('image'));i.src=src});
async function pdfToImage(file){
  await loadScript(LIB.pdf);
  const pdfjs=window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc=LIB.pdfWorker;
  const buf=await file.arrayBuffer();
  const doc=await pdfjs.getDocument({data:buf}).promise;
  let pageNo=1;
  if(doc.numPages>1){busy(false);const r=await modal({title:t('pdf_page'),html:`<p class="hint">${esc(t('pdf_pages',{n:doc.numPages}))}</p><input type="number" name="p" min="1" max="${doc.numPages}" value="1">`});if(!r)return null;pageNo=Math.min(doc.numPages,Math.max(1,Math.round(num(r.p))||1));busy(true,t('loading'))}
  const page=await doc.getPage(pageNo);const v1=page.getViewport({scale:1});const sc=Math.min(4,3000/Math.max(v1.width,v1.height));const vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return c.toDataURL('image/jpeg',.9);
}

function parseDims(v){const m=String(v||'').match(/\d+(?:[.,]\d+)?/g);return m&&m.length>=2?[num(m[0]),num(m[1])]:null}

function renderPlan(){

// ---------------------------------------------------------------- calculation
function compute(){
  const st=S(),res=1+st.reserve/100,W=[],lines=[],labor=[];
  const addLine=(type,item,qty,unit,note,m)=>{if(!(qty>0))return;const ex=lines.find(l=>l.item===item&&l.unit===unit&&item);if(ex){ex.qty+=qty;ex.sum=ex.qty*ex.price;if(m)ex.m=(ex.m||0)+m;return}const pr=priceOf(item);lines.push({type,item,name:itemLabel(item),qty,unit,price:pr,sum:qty*pr,note,m:m||0})};
  const missing=new Set();const miss=(type,d)=>missing.add(t('t_'+type)+(d?' Ø'+d:''));
  // area / volume
  let area=0;const noScale=new Set();
  state.floors.forEach(f=>{const ppm=pxPerM(f);f.areas.forEach(a=>{if(!ppm){noScale.add(f.id);return}area+=polyArea(a.pts)/ppm/ppm})});
  const areaAuto=area;if(num(state.areaManual)>0)area=num(state.areaManual);
  const height=num(state.height);const volume=area*height;const reqAir=volume*st.ach;
  const recup=itemById(state.recupId);
  if(!recup)W.push(t('w_no_recup'));
  else{ if(recup.airflow<reqAir)W.push(t('w_recup_small',{a:f0(recup.airflow),b:f0(reqAir)})); if(!recupObj())W.push(t('w_recup_unplaced')) }
  if(!(area>0))W.push(t('w_no_area'));
  // flex routes
  const sides={supply:{n75:0,n90:0,cap:0},extract:{n75:0,n90:0,cap:0}};
  const flexLen={75:0,90:0},flexCount={75:0,90:0};let flexRaw=0;
  const colPipes={},diffPipes={};
  state.routes.filter(r=>r.kind==='flex').forEach(r=>{
    const f=state.floors.find(x=>x.id===r.floor);if(!pxPerM(f))noScale.add(f.id);
    const len=routeLenM(r,f);flexRaw+=len;flexLen[r.d]=(flexLen[r.d]||0)+len;flexCount[r.d]=(flexCount[r.d]||0)+1;
    const c=rootCollector(r.from);if(c){(colPipes[c.id]=colPipes[c.id]||[]).push(r.d);const s=sides[c.side];s['n'+r.d]++;s.cap+=r.d==90?st.cap90:st.cap75}
    (diffPipes[r.to]=diffPipes[r.to]||[]).push(r.d);
  });
  state.routes.filter(r=>r.kind==='rigid').forEach(r=>{const f=state.floors.find(x=>x.id===r.floor);if(!pxPerM(f))noScale.add(f.id)});
  noScale.forEach(id=>{const f=state.floors.find(x=>x.id===id);if(f)W.push(t('w_noscale',{floor:floorName(f)}))});
  const need=reqAir;
  ['supply','extract'].forEach(k=>{const s=sides[k];s.need=need;s.ok=need>0&&s.cap>=need;if(need>0&&s.cap<need&&(s.n75+s.n90>0||recup))W.push(t('w_side_low',{side:t(k),cap:f0(s.cap),need:f0(need)}))});
  const min75=need>0?Math.ceil(need/st.cap75):0,min90=need>0?Math.ceil(need/st.cap90):0;
  // recuperator
  if(recup)addLine('recuperator',recup,1,'u_pcs');
  // collectors
  let emptyCols=0;const capsBy={};
  state.objects.filter(o=>o.kind==='collector').forEach(o=>{const ds=colPipes[o.id]||[];if(!ds.length){o._model=null;emptyCols++;return}
    const set=[...new Set(ds)];const rg=recup?recup.group:'';const all=itemsOf('collector').filter(c=>(+c.diameter===0||(set.length===1&&+c.diameter===set[0]))&&(!c.group||c.group===rg));
    if(!all.length){miss('collector',set.length===1?set[0]:'');return}
    const rd=recup?+recup.diameter:0;const fits=a=>a.some(c=>c.outlets>=ds.length);let pool=all;
    const grp=all.filter(c=>c.group&&c.group===rg);if(fits(grp))pool=grp;const pref=pool.filter(c=>+c.inlet===rd);if(fits(pref))pool=pref;
    const fit=pool.filter(c=>c.outlets>=ds.length).sort((a,b)=>a.outlets-b.outlets||a.price-b.price);let it,cnt=1;
    if(fit.length)it=fit[0];else{it=all.sort((a,b)=>b.outlets-a.outlets)[0];cnt=Math.ceil(ds.length/Math.max(1,it.outlets));W.push(t('w_col_multi',{n:ds.length,c:cnt,name:it.name}))}
    o._model=it.id;addLine('collector',it,cnt,'u_pcs');
    const free=it.outlets*cnt-ds.length;if(free>0){const cd=+it.diameter||mode(ds);capsBy[cd]=(capsBy[cd]||0)+free}
  });
  if(emptyCols)W.push(t('w_col_empty',{n:emptyCols}));
  // diffusers + plenums
  let freeDiff=0;
  state.objects.filter(o=>o.kind==='diffuser').forEach(o=>{const ds=diffPipes[o.id]||[];
    const ch=itemById(o.itemId);const fixed=ch&&ch.type==='diffuser'?ch:null;let box=null;
    if(ds.length){const set=[...new Set(ds)];if(set.length>1)W.push(t('w_plenum_mixed'));const d=set.length>1?mode(ds):set[0];
      let pl=itemsOf('plenum').filter(p=>+p.diameter===+d||+p.diameter===0);
      if(!pl.length)miss('plenum',d);
      else{ if(fixed&&+fixed.diameter){const m=pl.filter(p=>+p.inlet===+fixed.diameter);if(m.some(p=>p.outlets>=ds.length))pl=m}
        const fit=pl.filter(p=>p.outlets>=ds.length).sort((a,b)=>a.outlets-b.outlets||a.price-b.price)[0];
        if(fit){box=fit;addLine('plenum',fit,1,'u_pcs')}
        else{W.push(t('w_plenum_big',{n:ds.length,d}));const big=pl.sort((a,b)=>b.outlets-a.outlets)[0];box=big;addLine('plenum',big,Math.ceil(ds.length/Math.max(1,big.outlets)),'u_pcs')} }
    } else freeDiff++;
    const it=fixed||defaultDiffuser(o.side,box?box.inlet:0);o._box=box?box.id:null;o._diff=it?it.id:null;
    if(it)addLine('diffuser',it,1,'u_pcs');else miss('diffuser');
  });
  if(freeDiff)W.push(t('w_diff_free',{n:freeDiff}));
  // flexible pipes (coils) + rings + caps
  [75,90].forEach(d=>{if(!flexLen[d])return;const it=pickD('flex_pipe',d);const total=flexLen[d]*res;
    if(!it){miss('flex_pipe',d);return}const coil=it.length>0?it.length:50;addLine('flex_pipe',it,Math.ceil(total/coil),'u_coil',`${f1(total)} ${t('mm')}`,total)});
  [75,90].forEach(d=>{if(!flexCount[d])return;const it=pickD('ring',d);if(!it){miss('ring',d);return}addLine('ring',it,flexCount[d]*st.ringsPerPipe,'u_pcs')});
  Object.keys(capsBy).forEach(d=>{const it=pickD('cap',d);if(!it){miss('cap',d);return}addLine('cap',it,capsBy[d],'u_pcs')});
  // rigid
  const rigidBy={};let outside=0;
  state.routes.filter(r=>r.kind==='rigid').forEach(r=>{const pts=routePts(r);const f=state.floors.find(x=>x.id===r.floor);const ppm=pxPerM(f);
    const len=ppm?polyLen(pts)/ppm*res:0;const b=rigidBy[r.d]=rigidBy[r.d]||{pieces:0,len:0,elbows:0,grilles:0};
    const it=pickD('rigid_pipe',r.d);const pl=it&&it.length>0?it.length:1;b.pieces+=len>0?Math.ceil(len/pl):0;b.len+=len;b.elbows+=turns(pts);
    if(r.rkind!=='internal'){b.grilles++;outside++}});
  Object.keys(rigidBy).forEach(d=>{const b=rigidBy[d];
    const p=pickD('rigid_pipe',d);if(p)addLine('rigid_pipe',p,b.pieces,'u_pcs',`${f1(b.len)} ${t('mm')}`,b.len);else miss('rigid_pipe',d);
    if(b.elbows){const e=pickD('elbow',d);if(e)addLine('elbow',e,b.elbows,'u_pcs');else miss('elbow',d)}
    if(b.grilles){const g=pickD('grille',d);if(g)addLine('grille',g,b.grilles,'u_pcs');else miss('grille',d)}});
  if(recup&&!outside)W.push(t('w_no_outside'));
  // extras
  Object.keys(state.extras||{}).forEach(id=>{const it=itemById(id);const q=Math.round(num(state.extras[id]));if(it&&q>0)addLine(it.type,it,q,'u_pcs')});
  state.objects.filter(o=>o.kind==='riser'&&!rootCollector(o.id)).length&&W.push(t('w_riser'));
  if(missing.size)W.push(t('w_missing',{what:[...missing].join(', ')}));
  // labor
  const flexM=Math.round(flexRaw*res*10)/10;
  if(flexM>0)labor.push({name:t('lab_flex'),qty:flexM,unit:'u_m',price:st.laborFlexPerM,sum:flexM*st.laborFlexPerM});
  if(recup)labor.push({name:t('lab_recup'),qty:1,unit:'u_pcs',price:st.laborRecup,sum:st.laborRecup});
  if(outside)labor.push({name:t('lab_out'),qty:outside,unit:'u_pcs',price:st.laborOutside,sum:outside*st.laborOutside});
  const order=TYPES;lines.sort((a,b)=>order.indexOf(a.type)-order.indexOf(b.type));
  const mat=lines.reduce((s,l)=>s+l.sum,0),lab=labor.reduce((s,l)=>s+l.sum,0),net=mat+lab,vat=net*st.vat/100;
  return{area,areaAuto,height,volume,reqAir,recup,sides,min75,min90,need,lines,labor,mat,lab,net,vat,gross:net+vat,warnings:W,flexLen,flexM};
}
function mode(arr){const c={};arr.forEach(x=>c[x]=(c[x]||0)+1);return +Object.keys(c).sort((a,b)=>c[b]-c[a]||b-a)[0]}
function defaultDiffuser(side,dia){const L=itemsOf('diffuser');const by=a=>a.sort((x,y)=>x.price-y.price)[0];const okD=d=>!+dia||!+d.diameter||+d.diameter===+dia;
  return by(L.filter(d=>d.kind===side&&okD(d)))||by(L.filter(d=>d.kind==='any'&&okD(d)))||by(L.filter(d=>d.kind===side))||by(L.filter(d=>d.kind==='any'))||L[0]}

function estimateRows(c){
  const rows=[];
  // Client report: recuperator as its own position (with model); other materials by name only, merged by type; installation as one sum.
  const rec=c.lines.filter(l=>l.type==='recuperator'),mat=c.lines.filter(l=>l.type!=='recuperator');
  if(rec.length){rows.push({grp:t('t_recuperator')});rec.forEach(l=>rows.push({name:l.item.name,qty:l.qty,unit:t(l.unit),price:l.price,sum:l.sum}))}
  if(mat.length){rows.push({grp:t('materials')});const g=[];
    mat.forEach(l=>{let x=g.find(y=>y.type===l.type&&y.unit===l.unit);if(!x){x={type:l.type,unit:l.unit,qty:0,sum:0,m:0};g.push(x)}x.qty+=l.qty;x.sum+=l.sum;x.m+=l.m||0});
    g.forEach(x=>rows.push({name:t('t_'+x.type)+(x.m?` (${f1(x.m)} ${t('mm')})`:''),qty:x.qty,unit:t(x.unit),price:x.qty?x.sum/x.qty:0,sum:x.sum}));
    if(rec.length)rows.push({tot:t('mat_total'),sum:mat.reduce((a,l)=>a+l.sum,0)})}
  if(c.lab>0){rows.push({grp:t('labor')});rows.push({name:t('labor'),qty:1,unit:t('u_set'),price:c.lab,sum:c.lab})}
  rows.push({tot:t('subtotal'),sum:c.net,strong:true});rows.push({tot:t('vat',{v:f1(S().vat)}),sum:c.vat});rows.push({grand:t('total'),sum:c.gross});
  return rows;
}

async function planPNG(f,maxW,q=.88){
  const img=images[f.imageId];if(!img)return null;const k=Math.max(img.w,img.h)/1300;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${img.w}" height="${img.h}" viewBox="0 0 ${img.w} ${img.h}"><rect width="100%" height="100%" fill="#fff"/><image href="${img.src}" xlink:href="${img.src}" width="${img.w}" height="${img.h}"/>${overlayMarkup(f,k,{print:true})}</svg>`;
  const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  try{const im=await loadImg(url);const sc=Math.min(1,maxW/img.w);const c=document.createElement('canvas');c.width=Math.round(img.w*sc);c.height=Math.round(img.h*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return{src:c.toDataURL('image/jpeg',q),w:c.width,h:c.height}}
  finally{URL.revokeObjectURL(url)}
}

    const name=(t('est_title')+(cl.name?' - '+cl.name:'')).replace(/[\\/:*?"<>|]/g,'')+'.pdf';
    if(await saveBlob(blob,name))toast(t('pdf_done'));

  admRefresh:()=>{adm.leads=null;adm.plans={};renderAdmin()},
  admPw:async()=>{
    const r=await modal({title:t('change_pw'),okText:t('change_pw'),html:`<label class="fld"><span>${esc(t('cur_pw'))}</span><input type="password" name="cur" autocomplete="current-password"></label>
      <label class="fld"><span>${esc(t('new_pw'))}</span><input type="password" name="pw1" autocomplete="new-password"></label>
      <label class="fld"><span>${esc(t('new_pw2'))}</span><input type="password" name="pw2" autocomplete="new-password"></label>`});
    if(!r)return;
    if(r.pw1.length<8){toast(t('pw_short'),true);return}
    if(r.pw1!==r.pw2){toast(t('pw_mismatch'),true);return}
    try{let email=sess&&sess.email;
      if(!email){const u=await sb('/auth/v1/user',{auth:true});email=u&&u.email}
      try{await sbAuth('password',{email,password:r.cur})}catch(e){toast(t('cur_pw_wrong'),true);return}
      await sb('/auth/v1/user',{method:'PUT',auth:true,body:{password:r.pw1}});
      toast(t('pw_changed'))}
    catch(err){if(err.status===401)return admErr(err);toast(String(err.message||err),true)}},
  admLogout:()=>{sbLogout();adm.authed=false;adm.checked=true;adm.data=null;adm.leads=null;renderAdmin()},
  leadOpen:b=>{const id=b.dataset.id;adm.open[id]=!adm.open[id];
    if(adm.open[id]&&!adm.plans[id]){adm.plans[id]='loading';sb('/rest/v1/calc_leads?id=eq.'+encodeURIComponent(id)+'&select=plans',{auth:true}).then(r=>{adm.plans[id]=(r&&r[0]&&r[0].plans)||[];renderAdmin()}).catch(e=>{delete adm.plans[id];admErr(e)})}
    renderAdmin()},
  leadStatus:async b=>{const L=adm.leads.find(x=>String(x.id)===b.dataset.id);const ns=L.status==='done'?'new':'done';
    try{await sb('/rest/v1/calc_leads?id=eq.'+encodeURIComponent(L.id),{method:'PATCH',auth:true,body:{status:ns},prefer:'return=minimal'});L.status=ns;renderAdmin()}catch(e){admErr(e)}},
  leadDel:async b=>{if(!(await modal({title:t('l_delete_q'),html:'',okText:t('del')})))return;
    try{await sb('/rest/v1/calc_leads?id=eq.'+encodeURIComponent(b.dataset.id),{method:'DELETE',auth:true,prefer:'return=minimal'});adm.leads=adm.leads.filter(x=>String(x.id)!==b.dataset.id);renderAdmin()}catch(e){admErr(e)}},
  admAdd:()=>{adm.data.items.unshift({id:uid(),type:adm.filter||'recuperator',sku:'',name:'',diameter:0,airflow:0,outlets:0,length:0,kind:'any',price:0});adm.dirty=true;renderAdmin()},
  admDel:b=>{adm.data.items.splice(+b.dataset.i,1);adm.dirty=true;renderAdmin()},
  admResetDemo:async()=>{if(!(await modal({title:t('reset_demo'),html:'',okText:t('yes')})))return;adm.data.items=DEMO_ITEMS.map(x=>({...x}));adm.data.settings={...DEFAULT_SETTINGS};adm.dirty=true;renderAdmin()},
  admSave:async()=>{const nd=normData(adm.data);nd.demo=false;
    try{ if(serverMode){const {demo,...data}=nd;await sb('/rest/v1/calc_catalog',{method:'POST',auth:true,prefer:'resolution=merge-duplicates,return=minimal',body:{id:1,data,updated_at:new Date().toISOString()}});adm.empty=!data.items.length}
      else localStorage.setItem('recu_catalog',JSON.stringify(nd));
      if(serverMode)await loadData();else DATA=nd;adm.data=JSON.parse(JSON.stringify(nd));adm.dirty=false;toast(t('saved'));renderAdmin();renderAll()}
    catch(err){if(err.status===401)return admErr(err);toast(t('save_err',{e:err.message||err}),true)}},
  admImport:()=>$('#catIn').click(),
  admExport:async()=>{try{await loadScript(LIB.xlsx);const rows=adm.data.items.map(it=>{const o={};FIELDS.forEach(f=>o[f]=NUMF.includes(f)?num(it[f]):it[f]);return o});
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows,{header:FIELDS}),'catalog');
    const help=[{type:'type',meaning:'recuperator, collector, plenum, diffuser, flex_pipe, rigid_pipe, elbow, grille, cap, ring, silencer, accessory'},{type:'kind',meaning:'supply / extract / any (diffuser)'},{type:'diameter',meaning:'mm; collector 0 = 75+90'},{type:'length',meaning:'flex_pipe: coil m; rigid_pipe: piece m'},{type:'price',meaning:'EUR bez PVN / без PVN'}];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(help),'help');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});await saveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'katalogs.xlsx')}catch(err){toast(String(err.message||err),true)}}
};
const HDR={type:['type','тип','veids','tips'],sku:['sku','slug','артикул','artikuls','kods','code'],name:['name','model','название','наименование','nosaukums'],group:['group','subcategory','группа','grupa'],dims:['dims','dimensions_mm','размеры','izmēri','size'],
  diameter:['diameter','duct_diameter_mm','диаметр','diametrs','ø','d'],inlet:['inlet','вход','ieeja'],airflow:['airflow','airflow_max_m3h','расход','plūsma','plusma'],outlets:['outlets','выходов','выходы','izejas','izeju sk.'],
  length:['length','длина','garums'],kind:['kind','назначение','pielietojums'],price:['price','price_eur','цена','cena']};
function typeFromAny(v){v=String(v||'').trim().toLowerCase();if(TYPES.includes(v))return v;for(const ty of TYPES)for(const L of ['ru','lv'])if(I18N[L]['t_'+ty].toLowerCase()===v)return ty;return null}
function kindFromAny(v){v=String(v||'').trim().toLowerCase();if(['supply','приток','pieplūde'].includes(v))return'supply';if(['extract','вытяжка','nosūce'].includes(v))return'extract';return'any'}
$('#catIn').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  try{await loadScript(LIB.xlsx);const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const items=[];rows.forEach(r=>{const o={};Object.keys(r).forEach(h=>{const key=String(h).replace(/^\uFEFF/,'').trim().toLowerCase();for(const f in HDR)if(HDR[f].includes(key))o[f]=r[h]});
      const ty=typeFromAny(o.type)||(o.type===undefined&&num(o.airflow)>0?'recuperator':null);if(!ty||(o.price!==undefined&&String(o.price).trim()===''&&ty==='recuperator'))return;
      if(ty==='recuperator'&&o.name&&!/alpicair|komfovent/i.test(o.name)&&o.group!==undefined&&o.sku&&/^nest|^alpicair/i.test(o.sku))o.name='AlpicAir '+o.name;
      items.push({id:uid(),type:ty,sku:String(o.sku??''),name:String(o.name??''),group:String(o.group??''),dims:String(o.dims??'').replace(/\s*[x×*]\s*/gi,'×'),inlet:num(o.inlet),diameter:num(o.diameter),airflow:num(o.airflow),outlets:Math.round(num(o.outlets)),length:num(o.length),kind:kindFromAny(o.kind),price:num(o.price)})});
    if(!items.length){toast(t('imported',{n:0}),true);return}
    const r=await modal({title:t('import'),html:`<p class="hint">${esc(t('import_mode',{n:items.length}))}</p>`,buttons:[{v:null,label:t('cancel')},{v:'append',label:t('import_append')},{v:'replace',label:t('import_replace'),pri:true}]});
    if(!r)return;if(r==='replace')adm.data.items=items;else adm.data.items.push(...items);adm.dirty=true;renderAdmin();toast(t('imported',{n:items.length}))}
  catch(err){toast(String(err.message||err),true)}});

// ---------------------------------------------------------------- routing / init
function route(){const a=location.hash==='#admin';document.body.classList.toggle('admin',a);if(!a){adm.data=null;adm.leads=null;adm.plans={}}if(a){adm.data=null;adm.dirty=false;adm.checked=false;renderAdmin()}else{renderAll();requestAnimationFrame(fitView)}}
(async function init(){
  applyI18n();
  await loadData();
  await loadProject();
  window.addEventListener('hashchange',route);
  route();
  window.__recu={get state(){return state},compute,setTool,fitView,ui,view,get DATA(){return DATA}};
})();
</script>
</body>
